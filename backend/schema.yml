  /api/consultations/:
    get:
      operationId: consultations_list
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      parameters:
      - in: query
        name: appointment
        schema:
          type: integer
      - in: query
        name: consultation_date__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: consultation_date__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: doctor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - OPEN
        description: |-
          * `OPEN` - Open
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
