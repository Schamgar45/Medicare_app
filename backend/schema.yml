openapi: 3.0.3
info:
  title: MediCare Connect API
  version: 1.2.0
  description: API REST de gestion d'un centre médical (Django REST Framework).
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
paths:
  /api/appointments/:
    get:
      operationId: appointments_list
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      parameters:
      - in: query
        name: appointment_date
        schema:
          type: string
          format: date
      - in: query
        name: appointment_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: appointment_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: doctor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: service
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - CONFIRMED
          - IN_PROGRESS
          - NO_SHOW
          - SCHEDULED
          - WAITING
        description: |-
          * `SCHEDULED` - Scheduled
          * `CONFIRMED` - Confirmed
          * `WAITING` - Waiting
          * `IN_PROGRESS` - In progress
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
          * `NO_SHOW` - No show
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: appointments_create
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) appointment.
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    put:
      operationId: appointments_update
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    patch:
      operationId: appointments_partial_update
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    delete:
      operationId: appointments_destroy
      description: |-
        À placer avant ModelViewSet. Réglages déclaratifs par vue :

        doctor_lookup         chemin ORM vers le Doctor propriétaire ("doctor", "prescription__doctor"...)
        patient_lookup        sinon, chemin ORM vers le Patient ("patient", ou "pk" pour Patient lui-même)
        doctor_can_create     False : un médecin ne peut pas créer cet objet (ex. patient, rendez-vous)
        doctor_update_fields  si défini, seuls ces champs sont modifiables par un médecin
        doctor_must_be_self   champs « médecin » qui doivent désigner le médecin connecté
        doctor_visible_patient_fields  champs « patient » qui doivent désigner l'un de ses patients
        doctor_owned_relations  {champ: attribut} : l'objet référencé doit appartenir au médecin
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) appointment.
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/audit/:
    get:
      operationId: audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: table_name
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit/{id}/:
    get:
      operationId: audit_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) audit log.
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/{user_id}/status/:
    post:
      operationId: auth_status_create
      description: |-
        (Historique, gardé pour compatibilité) Définit le statut d'un compte.

        POST /api/auth/<user_id>/status/ {"status": "ACTIVE"|"INACTIVE"|"SUSPENDED"}
        Préférez PATCH /api/auth/users/<id>/ ou POST .../deactivate|activate.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserStatusRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserStatusRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: |-
        Change le mot de passe de l'utilisateur connecté.

        POST /api/auth/change-password/ {"old_password", "new_password", "confirm_password"}
        L'ancien mot de passe est vérifié, et le changement n'est possible qu'une
        seule fois par période de 7 jours (contrôlé côté serveur).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/password-reset-confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/profile/toggle-active/:
    post:
      operationId: auth_profile_toggle_active_create
      description: |-
        (Historique, gardé pour compatibilité) Active/désactive un compte.

        POST payload: { "user_id": int, "action": "deactivate"|"reactivate" }
        Préférez PATCH /api/auth/users/<id>/ ou POST .../deactivate|activate.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleUserActiveRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ToggleUserActiveRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ToggleUserActiveRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleUserActiveResponse'
          description: ''
  /api/auth/profile/update/:
    patch:
      operationId: auth_profile_update_partial_update
      description: |-
        Met à jour le profil de l'utilisateur connecté.

        PATCH /api/auth/profile/update/ — données libres (prénom, nom, username,
        e-mail, téléphone, genre, photo). Le rôle et le statut ne sont PAS
        modifiables ici. Le changement d'e-mail exige le mot de passe actuel.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Création d'un compte. ADMIN=staff réservée au superuser ; le reste
        à l'ADMIN.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/server-time/:
    get:
      operationId: auth_server_time_retrieve
      description: |-
        Heure courante du serveur (pour salutation/horloge côté client).

        Le client ne doit PAS se fier à l'horloge de l'appareil, qui peut être mal
        réglée ou dans un autre fuseau. On renvoie l'instant serveur (avec son
        offset) et le fuseau serveur pour l'affichage/la salutation.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTimeResponse'
          description: ''
  /api/auth/users/:
    get:
      operationId: auth_users_list
      description: |-
        Gestion des comptes (ADMIN) : liste, détail, modification, suppression.

        La création passe par POST /api/auth/register/.
        La désactivation (soft-delete) passe par PATCH {"status": "INACTIVE"}
        ou POST .../deactivate|activate. DELETE supprime définitivement.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - CASHIER
          - DOCTOR
          - LABORANT
          - PHARMACIST
          - RECEPTIONIST
        description: |-
          * `ADMIN` - Admin
          * `DOCTOR` - Doctor
          * `RECEPTIONIST` - Receptionist
          * `LABORANT` - Laborant
          * `PHARMACIST` - Pharmacist
          * `CASHIER` - Cashier
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `SUSPENDED` - Suspended
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/auth/users/{id}/:
    get:
      operationId: auth_users_retrieve
      description: |-
        Gestion des comptes (ADMIN) : liste, détail, modification, suppression.

        La création passe par POST /api/auth/register/.
        La désactivation (soft-delete) passe par PATCH {"status": "INACTIVE"}
        ou POST .../deactivate|activate. DELETE supprime définitivement.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_users_update
      description: |-
        Gestion des comptes (ADMIN) : liste, détail, modification, suppression.

        La création passe par POST /api/auth/register/.
        La désactivation (soft-delete) passe par PATCH {"status": "INACTIVE"}
        ou POST .../deactivate|activate. DELETE supprime définitivement.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_users_partial_update
      description: |-
        Gestion des comptes (ADMIN) : liste, détail, modification, suppression.

        La création passe par POST /api/auth/register/.
        La désactivation (soft-delete) passe par PATCH {"status": "INACTIVE"}
        ou POST .../deactivate|activate. DELETE supprime définitivement.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
