components:
  schemas:
    ActionEnum:
      enum:
      - deactivate
      - reactivate
      type: string
      description: |-
        * `deactivate` - deactivate
        * `reactivate` - reactivate
    Appointment:
      type: object
      description: 'Mixin de serializer : number_field / number_prefix, champ facultatif
        à la création.'
      properties:
        id:
          type: integer
          readOnly: true
        appointment_number:
          type: string
          maxLength: 50
        patient:
          type: integer
        patient_detail:
          allOf:
          - $ref: '#/components/schemas/PatientBrief'
          readOnly: true
        doctor:
          type: integer
        doctor_detail:
          allOf:
          - $ref: '#/components/schemas/DoctorBrief'
          readOnly: true
        service:
          type: integer
          nullable: true
        service_detail:
          allOf:
          - $ref: '#/components/schemas/ServiceBrief'
          readOnly: true
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        notes:
          type: string
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_date
      - appointment_time
      - created_at
      - created_by
      - doctor
      - doctor_detail
      - id
      - patient
      - patient_detail
      - service_detail
      - updated_at
    AppointmentRequest:
      type: object
      description: 'Mixin de serializer : number_field / number_prefix, champ facultatif
        à la création.'
      properties:
        appointment_number:
          type: string
          maxLength: 50
        patient:
          type: integer
        doctor:
          type: integer
        service:
          type: integer
          nullable: true
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        notes:
          type: string
      required:
      - appointment_date
      - appointment_time
      - doctor
      - patient
    AppointmentStatusEnum:
      enum:
      - SCHEDULED
      - CONFIRMED
      - WAITING
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_SHOW
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `CONFIRMED` - Confirmed
        * `WAITING` - Waiting
        * `IN_PROGRESS` - In progress
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `NO_SHOW` - No show
    AppointmentsStats:
      type: object
      properties:
        today:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        per_month:
          type: array
          items:
            $ref: '#/components/schemas/MonthPoint'
      required:
      - by_status
      - per_month
      - today
    AuditLog:
      type: object
      description: 'Journal d''audit en français lisible : « Schamgar a désactivé
        le compte Jean ».'
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
          description: Acteur de l'action (qui a fait).
        actor:
          type: string
          description: 'Qui a fait l''action : nom complet ou nom d''utilisateur.'
          readOnly: true
        action:
          type: string
          readOnly: true
        action_label:
          type: string
          readOnly: true
        target_label:
          type: string
          description: 'Cible de l''action : « le compte Jean Mukendi » plutôt que
            users.User #7.'
          readOnly: true
        changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              old: {}
              new: {}
            required:
            - field
            - old
            - new
          readOnly: true
          description: Liste des champs modifiés, avec leurs anciennes et nouvelles
            valeurs.
        table_name:
          type: string
          readOnly: true
        record_id:
          type: integer
          readOnly: true
          nullable: true
        old_data:
          readOnly: true
          nullable: true
        new_data:
          readOnly: true
          nullable: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_label
      - actor
      - changes
      - created_at
      - id
      - ip_address
      - new_data
      - old_data
      - record_id
      - table_name
      - target_label
      - user
      - user_agent
    BillingItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        category:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    BillingItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        category:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - name
    BillingStats:
      type: object
      properties:
        revenue_total:
          type: number
          format: double
        revenue_this_month:
          type: number
          format: double
        outstanding_balance:
          type: number
          format: double
        unpaid_invoices:
          type: integer
        revenue_per_month:
          type: array
          items:
            $ref: '#/components/schemas/MonthPoint'
      required:
      - outstanding_balance
      - revenue_per_month
      - revenue_this_month
      - revenue_total
      - unpaid_invoices
    BlankEnum:
      enum:
      - ''
    ChangePasswordRequest:
      type: object
      description: |-
        Changement de mot de passe par l'utilisateur connecté.

        L'ancien mot de passe est exigé ; le nouveau doit être confirmé,
        différent de l'actuel et conforme aux validateurs Django. La limite
