<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C3C7A" />
    <title>Medicare Hospital</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #edf1f8;
        transition: opacity 0.2s;
      }
      html[data-theme='dark'] #boot {
        background: #09101d;
      }
      #boot img {
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-bar {
        width: 140px;
        height: 4px;
        overflow: hidden;
        border-radius: 4px;
        background: rgb(128 150 190 / 25%);
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #2fa45b;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.94);
          opacity: 0.85;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('mh-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot">
      <img src="/brand/logo.png" alt="" width="96" height="96" fetchpriority="high" />
      <div class="boot-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
